name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: app-clima-linux
            binary_name: app-clima
          - os: windows-latest
            artifact_name: app-clima-windows.exe
            binary_name: app-clima.exe
          - os: macos-latest
            artifact_name: app-clima-macos
            binary_name: app-clima
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run build
      - name: Rename binary
        shell: bash
        run: mv ${{ matrix.os == 'windows-latest' && 'app-clima.exe' || 'app-clima' }} ${{ matrix.artifact_name }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            app-clima-linux/app-clima-linux
            app-clima-windows.exe/app-clima-windows.exe
            app-clima-macos/app-clima-macos
